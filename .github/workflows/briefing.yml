name: Portfolio briefing

on:
  # === AUTOMATICKÉ ODESÍLÁNÍ POZASTAVENO (na žádost) ===
  # Pro znovuzapnutí odkomentuj blok `schedule` níže (vrátí se hodinové pokusy v okně
  # 4-12 UTC = 6-13 Praha; main.py díky oknu + pojistce stejně pošle jen jednou denně).
  # schedule:
  #   - cron: "0 4-12 * * *"
  workflow_dispatch:       # ruční spuštění tlačítkem "Run workflow" (funguje i teď)

permissions:
  contents: write   # potřeba pro commit history.csv zpátky do repa po běhu

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MODEL: ${{ secrets.MODEL }}
          # Ruční spuštění ignoruje hodinovou pojistku (pošle hned):
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      # history.csv, glossary.md a docs/ (statický web) žijí jen v repu (runner je po běhu
      # smazaný) — commitni je zpátky. docs/ je zdroj pro GitHub Pages.
      - name: Commit updated history.csv / glossary.md / docs
        run: |
          git config user.name "portfolio-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.csv glossary.md docs
          git diff --cached --quiet || git commit -m "Update portfolio history / glossary / web [skip ci]"
          git push
